name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'techpulse-api/**'
  pull_request:
    branches: [main]
    paths:
      - 'techpulse-api/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techpulse-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: techpulse-api/package-lock.json

      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://test:test@localhost:5432/test
          SENTRY_DSN: ''

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t techpulse-api ./techpulse-api
