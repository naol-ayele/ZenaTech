<div class="page-header">
  <h2>Articles</h2>
  <a href="/admin/articles/new" class="btn btn-primary">+ New Article</a>
</div>

{{#articles.length}}
<table>
  <thead>
    <tr>
      <th>Title</th>
      <th>Category</th>
      <th>Views</th>
      <th>Published</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {{#articles}}
    <tr>
      <td><a href="{{editUrl}}" style="font-weight:500">{{title}}</a></td>
      <td>{{category}}</td>
      <td>{{views}}</td>
      <td>{{publishedDate}}</td>
      <td class="actions">
        <a href="{{editUrl}}" class="btn btn-primary btn-sm">Edit</a>
        <form action="{{deleteUrl}}" method="POST" class="form-inline delete-form" data-confirm="Delete «{{title}}»?">
          <button type="submit" class="btn btn-danger btn-sm">Delete</button>
        </form>
      </td>
    </tr>
    {{/articles}}
  </tbody>
</table>
{{/articles.length}}
{{^articles.length}}
<div class="empty-state">
  <p>No articles yet.</p>
  <a href="/admin/articles/new" class="btn btn-primary" style="margin-top:12px">Create your first article</a>
</div>
{{/articles.length}}
